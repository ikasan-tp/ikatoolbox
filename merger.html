<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKATOOLBOX | LOGMERGER</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:80px;%22>🦑</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Noto+Sans+JP:wght@400;500;700&family=Montserrat:wght@700;900&display=block" rel="stylesheet">

<style>
  :root {
    --bg-dark: #1a1a1a;
    --card-bg: #222222;
    --ui-border: #444444;
    --accent: #C5373C;
    --text-main: #dbdee1;
    --text-sub: #b5bac1;
  }

  .material-symbols-outlined {
    display: inline-block; width: 1em; height: 1em;
    overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    max-width: 800px; margin: 0 auto; padding: 80px 15px 60px;
    background-color: var(--bg-dark); color: var(--text-main);
    min-height: 100vh; box-sizing: border-box; position: relative;
  }

  .back-link {
    position: absolute; top: 30px; left: 20px;
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: var(--text-sub);
    font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 700;
    letter-spacing: 0.1em; transition: 0.3s; z-index: 1000;
  }
  .back-link:hover { color: var(--accent); transform: translateX(-5px); }

  .card {
    background: var(--card-bg); padding: 24px 28px;
    border-radius: 12px; border: 1px solid var(--ui-border); margin-bottom: 12px;
  }

  .ui-header { margin-bottom: 16px; border-bottom: 3px solid var(--accent); padding-bottom: 12px; }
  .ui-brand { font-family: 'Montserrat', sans-serif; font-size: 0.7rem; font-weight: 900; color: var(--accent); letter-spacing: 0.4em; display: block; margin-bottom: 2px; }
  .ui-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: 0.05em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ui-title-sub { color: var(--text-sub); font-size: 0.8rem; font-weight: 400; letter-spacing: 0.1em; }

  .privacy-note { font-size: 0.75em; color: var(--text-sub); margin-bottom: 16px; }

  .drop-zone {
    border: 2px dashed #4f545c; padding: 32px 20px;
    border-radius: 8px; background: #2a2a2a;
    cursor: pointer; text-align: center;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: #2e2020; }
  .drop-zone-icon { font-size: 2.4rem !important; width: 2.4rem !important; height: 2.4rem !important; color: var(--accent); display: block; margin: 0 auto 8px; }
  .drop-zone p { margin: 0; font-size: 0.82rem; color: var(--text-sub); }
  .drop-zone-link { color: var(--accent); text-decoration: underline; font-weight: bold; }

  .file-list { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .file-list-empty { text-align: center; color: var(--text-sub); font-size: 0.78em; padding: 20px; opacity: 0.5; }

  .file-item {
    background: #181818; padding: 10px 14px; border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center;
    border-left: 3px solid var(--accent); gap: 12px;
  }
  .file-item-order { display: flex; flex-direction: column; flex-shrink: 0; }
  .file-item-info { flex: 1; min-width: 0; }
  .file-name { font-size: 0.82em; color: #fff; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .file-anchors { font-size: 0.68em; color: #555; margin-top: 2px; }
  .label-setting { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .label-setting-title { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); flex-shrink: 0; }
  .label-select, .label-custom {
    background: #111; border: 1px solid var(--ui-border); color: #fff; padding: 6px 10px;
    border-radius: 4px; font-size: 0.8rem; font-family: inherit; outline: none; box-sizing: border-box;
  }
  .label-select { cursor: pointer; }
  .label-custom { flex: 1; min-width: 140px; }
  .label-select:focus, .label-custom:focus { border-color: var(--accent); }
  .label-help { display: none; font-size: 0.66rem; color: var(--text-sub); opacity: 0.6; margin-top: 6px; }
  .list-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .list-tools-hint { font-size: 0.68rem; color: var(--text-sub); opacity: 0.6; }
  .sort-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #1a1a1a;
    border: 1px solid var(--ui-border); color: #aaa; font-size: 0.72rem; font-weight: 700;
    border-radius: 4px; cursor: pointer; font-family: inherit; transition: 0.15s;
  }
  .sort-btn:hover { background: #2a2a2a; color: #fff; border-color: #666; }
  .sort-btn .material-symbols-outlined { font-size: 16px !important; width: 16px !important; height: 16px !important; }
  .drag-handle { cursor: grab; color: #555; flex-shrink: 0; font-size: 22px !important; width: 22px !important; height: 22px !important; user-select: none; transition: color 0.15s; }
  .drag-handle:hover { color: #ccc; }
  .drag-handle:active { cursor: grabbing; }
  .file-item { position: relative; }
  .file-item.dragging { opacity: 0.4; }
  .file-item.drop-before::before, .file-item.drop-after::after {
    content: ''; position: absolute; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: 2px; pointer-events: none;
  }
  .file-item.drop-before::before { top: -6px; }
  .file-item.drop-after::after { bottom: -6px; }
  .order-btn { padding: 6px 10px; }
  .order-btn .material-symbols-outlined { font-size: 24px !important; width: 24px !important; height: 24px !important; }
  .chapter-field { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .chapter-field-label { font-family: 'Montserrat', sans-serif; font-size: 0.58rem; font-weight: 900; color: var(--accent); letter-spacing: 0.2em; flex-shrink: 0; }
  .chapter-input {
    flex: 1; min-width: 0; background: #111; border: 1px solid var(--ui-border); color: #fff;
    padding: 6px 10px; border-radius: 4px; font-size: 0.82rem; font-family: inherit;
    box-sizing: border-box; outline: none; transition: border-color 0.15s;
  }
  .chapter-input:focus { border-color: var(--accent); }

  .icon-btn {
    background: transparent; color: #555; border: none; cursor: pointer; padding: 2px;
    display: flex; align-items: center; justify-content: center; transition: color 0.15s;
  }
  .icon-btn:hover:not(:disabled) { color: #ccc; }
  .icon-btn:disabled { opacity: 0.15; cursor: default; }
  .remove-btn:hover { color: #ff5252 !important; }
  .icon-btn .material-symbols-outlined { font-size: 18px !important; width: 18px !important; height: 18px !important; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; font-size: 0.9rem; cursor: pointer;
    background-color: var(--accent); color: white; border: none; border-radius: 4px;
    font-weight: 900; transition: 0.2s; margin-top: 14px;
    font-family: 'Montserrat', sans-serif; letter-spacing: 0.12em; box-sizing: border-box;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { background: #2a2a2a; border: 1px solid #333; cursor: not-allowed; color: #555; transform: none; filter: none; }
  .btn .material-symbols-outlined { font-size: 1.1rem !important; width: 1.1rem !important; height: 1.1rem !important; }

  #status { margin-top: 10px; font-size: 0.82em; color: var(--text-sub); text-align: center; min-height: 1.3em; }

  @media screen and (max-width: 600px) {
    body { padding: 60px 12px 60px; }
    .card { padding: 18px 14px; }
    .back-link { top: 10px; left: 10px; }
    .file-name { font-size: 0.75em; }
  }
</style>
</head>
<body>

  <a href="generator.html" class="back-link">
    <span class="material-symbols-outlined" style="font-size: 0.9rem;">arrow_back_ios</span>
    BACK TO LOG EDITOR
  </a>

  <div class="card">
    <div class="ui-header">
      <span class="ui-brand">IKATOOLBOX</span>
      <div class="ui-title">LOG MERGER <span class="ui-title-sub">for HTML LOG</span></div>
    </div>

    <p class="privacy-note">分割されたログを好きな順番で一本に結合します。目次・見出しはすべて維持されます。各ファイルが1つの「章」になり、章タイトルは下の欄で編集できます。</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="material-symbols-outlined drop-zone-icon">library_add</span>
      <p>HTMLログをドロップするか<br><span class="drop-zone-link">ファイルを選択</span></p>
      <input type="file" id="fileInput" multiple accept=".html" style="display:none" onchange="addFiles(event)">
    </div>

    <div class="label-setting">
      <span class="label-setting-title">章の表記</span>
      <select id="labelStyle" class="label-select" onchange="onLabelStyleChange()">
        <option value="chapter">CHAPTER 01</option>
        <option value="episode">EPISODE 01</option>
        <option value="wa_k">第一話</option>
        <option value="sho_k">第一章</option>
        <option value="none">表記なし（タイトルだけ）</option>
        <option value="custom">自由入力…</option>
      </select>
      <input type="text" id="labelCustom" class="label-custom" value="第{k}幕" style="display:none;" oninput="renderFileList()" placeholder="例: 第{k}幕 / Act {n} / {nn}">
    </div>
    <div class="label-help" id="labelHelp">自由入力では {n}=1、{nn}=01、{k}=一 が使えます（半角数字の「第1話」なら 第{n}話）。</div>

    <div id="listTools" class="list-tools" style="display:none;">
      <span class="list-tools-hint">つまみ（⋮⋮）をドラッグ、または矢印で章を移動</span>
      <button type="button" class="sort-btn" onclick="sortFilesByName()">
        <span class="material-symbols-outlined">sort_by_alpha</span>名前順に並べる
      </button>
    </div>

    <div id="fileList" class="file-list">
      <p class="file-list-empty">ファイルが追加されていません</p>
    </div>

    <button id="mergeBtn" class="btn" onclick="mergeHtmlLogs()" disabled>
      <span class="material-symbols-outlined">merge</span>
      ログを結合して保存
    </button>
    <div id="status"></div>
  </div>

  <div style="position: fixed; bottom: 10px; right: 15px; font-family: sans-serif; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.1em; font-weight: bold; pointer-events: none; z-index: 9999;">✦ IKATOOLBOX</div>

  <script>
    let filesData = [];

    function escapeHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 章タイトル（空欄＝タイトルなし。その場合は表記だけの見出しになる）
    function getChapterTitle(f) {
      return (f.chapterTitle || '').trim();
    }

    // ── 章の表記（CHAPTER 01 / 第一話 など）──
    // {n}=1, {nn}=01, {k}=一（漢数字）
    const LABEL_PRESETS = {
      chapter: 'CHAPTER {nn}',
      episode: 'EPISODE {nn}',
      wa_k:    '第{k}話',
      sho_k:   '第{k}章',
      none:    ''
    };
    function toKanji(n) {
      const d = ['〇','一','二','三','四','五','六','七','八','九'];
      if (n < 10) return d[n];
      if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
      if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
      return String(n);
    }
    function getLabelTemplate() {
      const v = document.getElementById('labelStyle').value;
      return v === 'custom' ? document.getElementById('labelCustom').value : (LABEL_PRESETS[v] ?? '');
    }
    function formatLabel(i) {
      const n = i + 1;
      return getLabelTemplate()
        .replace(/\{nn\}/g, String(n).padStart(2, '0'))
        .replace(/\{n\}/g, String(n))
        .replace(/\{k\}/g, toKanji(n))
        .trim();
    }
    function onLabelStyleChange() {
      const isCustom = document.getElementById('labelStyle').value === 'custom';
      document.getElementById('labelCustom').style.display = isCustom ? 'block' : 'none';
      document.getElementById('labelHelp').style.display = isCustom ? 'block' : 'none';
      renderFileList();
    }

    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover',  (e) => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', (e) => { e.preventDefault(); dz.classList.remove('dragover'); });
    dz.addEventListener('drop',      (e) => { e.preventDefault(); dz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    function addFiles(e) { handleFiles(e.target.files); e.target.value = ''; }

    // 名前順（01, 02, … 10 のように数字は数の大きさで）に並べるための比較関数
    const byName = (a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true });

    async function handleFiles(files) {
      const added = [];
      for (const file of Array.from(files)) {
        if (!file.name.endsWith('.html')) continue;
        const text = await file.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');

        // generator.html出力の構造から必要な情報を抽出
        const headHTML    = doc.head.innerHTML;
        const heroArea    = doc.querySelector('.hero-title-area');
        const container   = doc.querySelector('.container');
        const indexLinks  = doc.querySelectorAll('#index-list .index-link');

        // <head>からスタイルだけ取り出す（font/cssリンクは重複させない）
        const styleEl = doc.querySelector('head style');
        const inlineStyle = styleEl ? styleEl.outerHTML : '';

        // 目次エントリを [{text, href}] として保持
        const anchors = Array.from(indexLinks).map(a => ({
          text: a.textContent.trim(),
          href: a.getAttribute('href') // "#log-0" などの形式
        }));

        // セッションタイトル
        const heroTitle = heroArea ? heroArea.outerHTML : '';
        // 目次セクションの見出しに使うタイトルテキスト
const heroTitleText = heroArea
  ? (heroArea.querySelector('.hero-title')?.textContent.trim() || file.name.replace('.html',''))
  : file.name.replace('.html','');
        // コンテンツ本体（.containerの中身）
        const contentHTML = container ? container.innerHTML : doc.body.innerHTML;

        added.push({
          name: file.name,
          headHTML,
          inlineStyle,
          heroTitle,
          heroTitleText,
          chapterTitle: heroTitleText, // 章タイトル（ファイル一覧で編集できる）
          contentHTML,
          anchors
        });
      }
      // まとめて追加したファイルは名前順に並べてから末尾へ（すでに並べた分の順番は崩さない）
      added.sort(byName);
      filesData.push(...added);
      renderFileList();
    }

    // 並べ替え: from の章を to の位置（to は「その手前」を指す 0〜件数）へ移す
    function moveFile(from, to) {
      if (from < 0 || from >= filesData.length) return;
      if (to > from) to -= 1;
      if (to === from) return;
      const [moved] = filesData.splice(from, 1);
      filesData.splice(to, 0, moved);
      renderFileList();
    }

    function sortFilesByName() {
      filesData.sort(byName);
      renderFileList();
    }

    let dragIndex = -1;
    function clearDropMarks() {
      document.querySelectorAll('.file-item.drop-before, .file-item.drop-after')
        .forEach(el => el.classList.remove('drop-before', 'drop-after'));
    }

    function renderFileList() {
      const list = document.getElementById('fileList');
      const btn  = document.getElementById('mergeBtn');
      document.getElementById('listTools').style.display = filesData.length >= 2 ? 'flex' : 'none';

      if (filesData.length === 0) {
        list.innerHTML = '<p class="file-list-empty">ファイルが追加されていません</p>';
        btn.disabled = true;
        return;
      }

      list.innerHTML = '';
      filesData.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
            <span class="drag-handle material-symbols-outlined" title="ドラッグして章を移動">drag_indicator</span>
            <div class="file-item-order">
              <button class="icon-btn order-btn" title="ひとつ上へ" ${i === 0 ? 'disabled' : ''} data-swap-a="${i}" data-swap-b="${i-1}">
                <span class="material-symbols-outlined">expand_less</span>
              </button>
              <button class="icon-btn order-btn" title="ひとつ下へ" ${i === filesData.length - 1 ? 'disabled' : ''} data-swap-a="${i}" data-swap-b="${i+1}">
                <span class="material-symbols-outlined">expand_more</span>
              </button>
            </div>
            <div class="file-item-info">
              <span class="file-name">${i + 1}. ${f.name}</span>
              <div class="file-anchors">目次エントリ: ${f.anchors.length}件</div>
              <div class="chapter-field">
                ${formatLabel(i) ? `<span class="chapter-field-label">${escapeHtml(formatLabel(i))}</span>` : ''}
                <input type="text" class="chapter-input" data-chapter="${i}" value="${escapeHtml(f.chapterTitle)}" placeholder="章タイトル（空欄なら表記だけ表示）">
              </div>
            </div>
          </div>
          <button class="icon-btn remove-btn" data-remove="${i}">
            <span class="material-symbols-outlined">close</span>
          </button>
        `;
        list.appendChild(item);

        // ドラッグで並べ替え（つまみ部分を掴んだときだけドラッグ可能にして、入力欄の文字選択を邪魔しない）
        const handle = item.querySelector('.drag-handle');
        handle.addEventListener('mousedown', () => { item.draggable = true; });
        handle.addEventListener('mouseup',   () => { item.draggable = false; });
        item.addEventListener('dragstart', (e) => {
          dragIndex = i;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(i));
        });
        item.addEventListener('dragend', () => {
          item.draggable = false;
          item.classList.remove('dragging');
          clearDropMarks();
          dragIndex = -1;
        });
        item.addEventListener('dragover', (e) => {
          if (dragIndex < 0) return;
          e.preventDefault();
          const r = item.getBoundingClientRect();
          const after = e.clientY > r.top + r.height / 2;
          clearDropMarks();
          item.classList.add(after ? 'drop-after' : 'drop-before');
          item.dataset.dropAfter = after ? '1' : '0';
        });
        item.addEventListener('drop', (e) => {
          if (dragIndex < 0) return;
          e.preventDefault();
          const from = dragIndex;
          const to = i + (item.dataset.dropAfter === '1' ? 1 : 0);
          dragIndex = -1;
          clearDropMarks();
          moveFile(from, to);
        });
      });

      // イベント委譲でボタン処理（インラインonclickを避ける安全な方式）
      list.querySelectorAll('[data-swap-a]').forEach(btn => {
        btn.addEventListener('click', () => {
          swapFile(parseInt(btn.dataset.swapA), parseInt(btn.dataset.swapB));
        });
      });
      // 章タイトルの編集（入力のたびに一覧を作り直すとフォーカスが外れるので、データだけ更新する）
      list.querySelectorAll('.chapter-input').forEach(inp => {
        inp.addEventListener('input', () => {
          filesData[parseInt(inp.dataset.chapter)].chapterTitle = inp.value;
        });
      });
      list.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFile(parseInt(btn.dataset.remove));
        });
      });

      btn.disabled = filesData.length < 2;
    }

    function swapFile(idx1, idx2) {
      if (idx2 < 0 || idx2 >= filesData.length) return;
      [filesData[idx1], filesData[idx2]] = [filesData[idx2], filesData[idx1]];
      renderFileList();
    }

    function removeFile(i) {
      filesData.splice(i, 1);
      renderFileList();
    }

    function mergeHtmlLogs() {
      if (filesData.length < 2) return;

      // ベースのスタイル（最初のファイルから）
      const baseHead = filesData[0].headHTML;

      // 全ファイルの目次を結合（ファイルごとにIDプレフィックスを付けてアンカー衝突を防ぐ）
      let allIndexLinks = '';
      filesData.forEach((f, fi) => {
        // 章見出し（色はログ本体のアクセントカラーに追従。クリックでその章の先頭へ移動）
        const label = formatLabel(fi);
        const title = getChapterTitle(f);
        if (label || title) {
          let inner = '';
          if (label && title) inner = `<span class="index-chapter-num">${escapeHtml(label)}</span><span class="index-chapter-title">${escapeHtml(title)}</span>`;
          else inner = `<span class="index-chapter-title">${escapeHtml(label || title)}</span>`; // どちらか片方だけなら見出し1行
          allIndexLinks += `<a href="#chapter-${fi}" class="index-chapter" onclick="closeMenu()">${inner}</a>`;
        }
        f.anchors.forEach(anchor => {
          // href例: "#log-5" → "#f0-log-5"（ファイルインデックスのプレフィックスを付ける）
          const newHref = anchor.href.replace('#', `#f${fi}-`);
          allIndexLinks += `<a href="${newHref}" class="index-link" onclick="closeMenu()">${anchor.text}</a>`;
        });
      });

      // 各ファイルのコンテンツ本体（IDにファイルインデックスのプレフィックスを付けてアンカー衝突を防ぐ）
      let mergedSections = '';
      filesData.forEach((f, fi) => {
        // タイトルは最初のファイルのみ表示
        let sectionHtml = (fi === 0) ? f.heroTitle : '';

        // 章の区切り（全章の先頭に表示）
        const label = formatLabel(fi);
        const title = getChapterTitle(f);
        if (label || title) {
          let inner = '';
          if (label && title) inner = `<span class="chapter-divider-num">${escapeHtml(label)}</span><div class="chapter-divider-title">${escapeHtml(title)}</div>`;
          else inner = `<div class="chapter-divider-title">${escapeHtml(label || title)}</div>`; // どちらか片方だけなら見出し1行
          sectionHtml += `<div class="chapter-divider" id="chapter-${fi}">${inner}</div>`;
        }

        // コンテンツ内の id="log-N" を id="fN-log-N" に書き換えてID衝突を防ぐ
        let content = f.contentHTML;
        content = content.replace(/\bid="log-(\d+)"/g, `id="f${fi}-log-$1"`);
        // hero-title-areaがcontainer内に残っていれば除去（重複防止）
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        const innerHero = tempDiv.querySelector('.hero-title-area');
        if (innerHero) innerHero.remove();
        content = tempDiv.innerHTML;

        sectionHtml += content;
        mergedSections += sectionHtml;
      });

      // 章の区切りと目次の章見出し用スタイル（色はすべて var(--accent) を参照）
      const chapterStyle = `<style>

    .chapter-divider-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; border-left: 3px solid var(--accent); padding-left: 15px; line-height: 1.4; }
    .index-chapter { display: block; text-decoration: none; padding: 22px 20px 8px; border-bottom: 1px solid var(--accent); }
    .index-chapter-num { display: block; font-family: 'Montserrat', sans-serif; font-size: 0.55rem; font-weight: 900; color: var(--accent); letter-spacing: 0.3em; margin-bottom: 4px; }
    .index-chapter-title { display: block; font-size: 0.9rem; font-weight: 700; color: #fff; }
  </style>`;

      const fullHtml = `<!DOCTYPE html>

<head>

      const isVisible = btn.classList.contains('active');
      const container = document.querySelector('.container');
      if (container) {
        if (isVisible) container.classList.remove('hide-' + styleClass);
        else container.classList.add('hide-' + styleClass);

      const blob = new Blob([fullHtml], { type: 'text/html' });
