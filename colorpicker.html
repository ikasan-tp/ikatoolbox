<style>
:root{--bg-dark:#1a1a1a;--ui-bg:#222;--ui-input:#111;--ui-border:#444;--ui-accent:#C5373C;--text-main:#dbdee1;--text-sub:#b5bac1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg-dark);color:var(--text-main);font-family:'Noto Sans JP',sans-serif}
.material-symbols-outlined{display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;vertical-align:middle}
#app{display:flex;min-height:100vh}
.sidebar{width:290px;flex-shrink:0;background:var(--ui-bg);border-right:1px solid var(--ui-border);padding:14px 18px 40px}
.main-area{flex:1;padding:28px 32px;min-width:0}
.back-link{display:flex;align-items:center;gap:8px;text-decoration:none;color:#666;font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.08em;transition:.2s;margin-bottom:16px}
.back-link:hover{color:var(--ui-accent);transform:translateX(-3px)}
.back-link .material-symbols-outlined{font-size:.9rem;width:.9rem;height:.9rem}
.ui-header{margin-bottom:20px;border-bottom:3px solid var(--ui-accent);padding-bottom:12px}
.ui-brand{font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:900;color:var(--ui-accent);letter-spacing:.4em;display:block;margin-bottom:2px}
.ui-title{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:900;color:#fff;letter-spacing:.05em}
.ui-title-sub{font-family:'Noto Sans JP',sans-serif;font-size:.68rem;font-weight:400;color:#666;letter-spacing:.08em;margin-left:6px}
.control-group{padding:14px 0;border-bottom:1px solid #2a2a2a}.control-group:last-child{border-bottom:none}
.sec-h{font-family:'Montserrat',sans-serif;font-size:.62rem;color:var(--ui-accent);margin:0 0 12px;letter-spacing:.2em;font-weight:900;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--ui-accent);opacity:.2}
.f-lbl{display:block;font-size:.66rem;margin:10px 0 6px;color:#777;font-weight:700}
.view-tabs{display:flex;gap:2px;background:#111;padding:3px;border-radius:4px}
.view-tab{flex:1;background:transparent;color:#555;border:none;padding:7px 6px;border-radius:3px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-size:.7rem;transition:.2s}
.view-tab.active{background:var(--ui-accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:none;border:1px solid #333;color:#888;padding:5px 11px;border-radius:4px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:.2s}
.chips button:hover{border-color:#666;color:#bbb}
.chips button.on{border-color:var(--ui-accent);color:var(--ui-accent);background:rgba(197,55,60,.1)}
.drop{display:block;border:1px dashed var(--ui-border);border-radius:4px;padding:20px 10px;text-align:center;color:#777;font-size:.74rem;cursor:pointer;transition:.2s;background:var(--ui-input)}
.drop:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
canvas{max-width:100%;border-radius:4px;margin-top:10px;cursor:crosshair}
.sub{color:#666;font-size:.66rem;margin-top:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--ui-border);cursor:pointer;padding:0}
.sw button:hover{border-color:#fff}
.btn-primary{width:100%;padding:10px;background:transparent;color:var(--ui-accent);border:1px solid var(--ui-accent);border-radius:4px;font-weight:900;font-size:.78rem;cursor:pointer;transition:.2s;font-family:'Noto Sans JP',sans-serif;letter-spacing:.08em;margin-top:14px}
.btn-primary:hover{background:var(--ui-accent);color:#fff}
.btn-ghost{background:none;border:1px solid #333;color:#999;font-size:.72rem;font-weight:700;cursor:pointer;padding:8px 14px;border-radius:4px;font-family:'Noto Sans JP',sans-serif;transition:.2s}
.btn-ghost:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.empty{color:#555;font-size:.8rem;padding:60px 0;text-align:center}
.res{display:none;max-width:560px}
.hd{display:flex;gap:18px;align-items:center}
.big{width:96px;height:96px;border-radius:8px;border:1px solid var(--ui-border);flex:none}
.lead{font-size:.66rem;color:#777;font-weight:700}
.nm{font-size:1.6rem;font-weight:900;color:#fff;line-height:1.25;margin:2px 0}
.nm small{display:block;font-size:.8rem;color:#888;font-weight:400;margin:2px 0 0;line-height:1.4}
.desc{font-size:.76rem;color:var(--text-sub)}
.hex{font-family:'Montserrat',sans-serif;font-size:.9rem;font-weight:700;color:var(--text-main);letter-spacing:.06em;margin-top:4px}
.near{margin-top:14px;font-size:.68rem;color:#666}
.near button{background:var(--ui-input);border:1px solid #333;color:var(--text-main);border-radius:4px;padding:3px 10px;font:inherit;font-size:.72rem;cursor:pointer;margin:4px 4px 0 0}
.near button:hover{border-color:var(--ui-accent)}
.pv-lbl{font-size:.66rem;color:#777;font-weight:700;margin:12px 0 4px}
.prev{border-radius:4px;padding:12px 14px;font-size:.86rem;border:1px solid #333}
#adjbox{margin-top:14px}
@media(max-width:760px){#app{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--ui-border)}.main-area{padding:20px 16px 40px}.big{width:72px;height:72px}.nm{font-size:1.3rem}}

<div id="adjbox"></div>
<button class="btn-primary" id="copy">カラーコードをコピー</button>
</div>
</section></div>

const L=[];for(let i=0;i<D.length;i+=3)L.push({n:D[i],r:D[i+1],h:D[i+2],k:/[\u4e00-\u9fff]/.test(D[i])?'jp':'en'});
E.forEach(e=>L.push({n:e[0],r:e[2]||'',h:e[1],k:'en'}));
let LANG='all';
const $=id=>document.getElementById(id);
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const hx=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function lab(c){let[r,g,b]=c.map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))]}
const lum=c=>{const[r,g,b]=c.map(v=>{v/=255;return v>.03928?Math.pow((v+.055)/1.055,2.4):v/12.92});return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function toHsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;
if(d){s=d/(1-Math.abs(2*l-1));h=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s,l]}
function fromHsl(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
const[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255]}
function adjust(c,bg,min=4.5){if(cr(c,bg)>=min)return c;let[h,s,l]=toHsl(c);for(let i=0;i<60&&l<1;i++){l+=.01;c=fromHsl(h,s,l);if(cr(c,bg)>=min)break}return c}
const BG=[43,43,43];
// 分類(色値から計算)
function tone([h,s,l]){if(l<.25)return'暗い';if(l<.4)return s>.5?'濃い':'暗い';if(l>.72)return s>.55?'明るい':'やわらかい';return s>.55?'鮮やか':(s>.3?'やわらかい':'くすんだ')}
function fam([h,s,l]){if(s<.1)return'灰';if(h>=345||h<15)return l>.62?'桃':'赤';if(h<45)return l>.75?'桃':(l<.5&&s<.7?'茶':'橙');if(h<70)return l<.45?'茶':'黄';if(h<165)return'緑';if(h<260)return'青';if(h<315)return'紫';return l>.55?'桃':'赤'}
function hueName(h){return h<15||h>=345?'赤':h<40?'黄赤':h<70?'黄':h<90?'黄緑':h<165?'緑':h<200?'青緑':h<250?'青':h<275?'青紫':h<315?'紫':'赤紫'}
function describe(c){const p=toHsl(c);if(p[1]<.1)return p[2]>.9?'白':p[2]<.2?'黒':'灰色';
const t=tone(p);return({鮮やか:'鮮やかな',明るい:'明るい',やわらかい:'やわらかい',くすんだ:'くすんだ',濃い:'濃い',暗い:'暗い'})[t]+hueName(p[0])}
L.forEach(o=>{const c=rgb(o.h),p=toHsl(c);o.lab=lab(c);o.fam=fam(p);o.tone=tone(p)});
function nearest(c,k=3){const a=lab(c);return L.filter(o=>LANG=='all'||o.k==LANG).map(o=>({o,d:Math.hypot(a[0]-o.lab[0],a[1]-o.lab[1],a[2]-o.lab[2])})).sort((x,y)=>x.d-y.d).slice(0,k)}

let cur='';
function show(h){cur=h;const c=rgb(h),nn=nearest(c),n=nn[0],ex=n.d<6;
$('res').style.display='block';$('empty').style.display='none';$('big').style.background=h;
$('lead').textContent=ex?'この色の名前':'この色に一番近い色名';
$('nm').textContent=n.o.n;$('yomi').textContent=n.o.r;
$('desc').textContent=describe(c);
$('hex').textContent=h.toUpperCase()+'  /  RGB '+c.join(', ');
const nb=$('near');nb.innerHTML='<span class="sub">ほかに近い色: </span>';
nn.slice(1).forEach(x=>{const b=document.createElement('button');b.textContent=x.o.n;b.onclick=()=>show(x.o.h);nb.appendChild(b)});
$('pv1').style.color=h;$('pv2').style.color=h;
const box=$('adjbox');box.innerHTML='';const ah=hx(adjust(c,BG));
if(ah!==h){const b=document.createElement('button');b.className='btn-ghost';b.textContent='読みやすく補正: '+ah.toUpperCase();b.onclick=()=>show(ah);box.appendChild(b)}
$('res').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(cur.toUpperCase());$('copy').textContent='コピーしました'}catch(e){$('copy').textContent='コピーできませんでした'}setTimeout(()=>$('copy').textContent='カラーコードをコピー',1500)};
$('t1').onclick=()=>{$('t1').className='view-tab active';$('t2').className='view-tab';$('p1').hidden=false;$('p2').hidden=true};
$('t2').onclick=()=>{$('t2').className='view-tab active';$('t1').className='view-tab';$('p2').hidden=false;$('p1').hidden=true};

// 雰囲気ランダム
const HU=['赤','桃','橙','黄','緑','青','紫','茶','灰'],TO=['鮮やか','明るい','やわらかい','くすんだ','濃い','暗い'];
const H=new Set(),T=new Set();let last=null;
function chips(id,arr,set,onclick){const b=$(id);b.innerHTML='';arr.forEach(k=>{const e=document.createElement('button');e.textContent=k;e.className=set&&set.has(k)?'on':'';e.onclick=()=>onclick(k,e);b.appendChild(e)})}
const pool=()=>L.filter(o=>(LANG=='all'||o.k==LANG)&&(!H.size||H.has(o.fam))&&(!T.size||T.has(o.tone)));
function upd(){$('cnt').textContent='候補 '+pool().length+'色';chips('hues',HU,H,(k)=>{H.has(k)?H.delete(k):H.add(k);upd()});chips('tones',TO,T,(k)=>{T.has(k)?T.delete(k):T.add(k);upd()})}
function roll(){const p=pool().filter(o=>o!==last);if(!p.length){$('cnt').textContent='該当する色がありません。条件をゆるめてください';return}
last=p[Math.floor(Math.random()*p.length)];show(last.h)}
function langChips(){const b=$('langs');b.innerHTML='';[['all','すべて'],['jp','和名'],['en','洋名']].forEach(([k,t])=>{const e=document.createElement('button');e.textContent=t;e.className=LANG==k?'on':'';e.onclick=()=>{LANG=k;langChips();upd();if(cur)show(cur)};b.appendChild(e)})}
$('roll').onclick=roll;langChips();upd();

// 画像
function extract(d){const bins={};
for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const c=[d[i],d[i+1],d[i+2]],[h,s,l]=toHsl(c);
if(l>.92||l<.1||s<.18)continue;const k=(c[0]>>5)*64+(c[1]>>5)*8+(c[2]>>5);const o=bins[k]||(bins[k]={n:0,r:0,g:0,b:0,s:0});
o.n++;o.r+=c[0];o.g+=c[1];o.b+=c[2];o.s+=s}
const arr=Object.values(bins).map(o=>({c:[o.r/o.n,o.g/o.n,o.b/o.n],sc:o.n*(.4+o.s/o.n)})).sort((a,b)=>b.sc-a.sc);
const out=[];for(const o of arr){const l=lab(o.c);if(out.every(p=>{const m=lab(p);return Math.hypot(l[0]-m[0],l[1]-m[1],l[2]-m[2])>22}))out.push(o.c);if(out.length>=5)break}
return out}
function load(f){if(!f)return;const img=new Image();img.onload=()=>{const cv=$('cv'),w=img.width,h=img.height,sc=Math.min(1,320/Math.max(w,h));
cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);const x=cv.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);cv.hidden=false;
const cs=extract(x.getImageData(0,0,cv.width,cv.height).data);const box=$('cands');box.innerHTML='';
if(!cs.length){box.textContent='鮮やかな色が見つかりませんでした。画像をタップして色を拾ってください。';return}
cs.forEach(c=>{const b=document.createElement('button'),h=hx(c);b.style.background=h;b.title=h;b.onclick=()=>show(h);box.appendChild(b)});show(hx(cs[0]))};
img.src=URL.createObjectURL(f)}
$('file').onchange=e=>load(e.target.files[0]);
const dr=$('drop');dr.ondragover=e=>e.preventDefault();dr.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
$('cv').onclick=e=>{const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)*e.target.width/r.width,y=(e.clientY-r.top)*e.target.height/r.height;
const p=e.target.getContext('2d').getImageData(x,y,1,1).data;if(p[3]>0)show(hx([p[0],p[1],p[2]]))};
